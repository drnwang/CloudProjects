<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Static Site on S3 + CloudFront</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; max-width: 640px; margin: 64px auto; padding: 0 16px; line-height: 1.6; color: #1f2933; }
    h1 { font-size: 2rem; margin-bottom: 0.25rem; }
    code { background: #eef2f5; padding: 0.1em 0.35em; border-radius: 3px; }
  </style>
</head>
<body>
  <h1>Hello from CloudFront</h1>
  <p>This page is stored in a private Amazon S3 bucket and delivered over HTTPS by Amazon CloudFront using Origin Access Control.</p>
  <p>Requests made directly to the S3 bucket return <code>403 Access Denied</code>.</p>
</body>
</html>
